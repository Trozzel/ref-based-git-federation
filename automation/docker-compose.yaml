services:
  gitea-1:
    image: gitea/gitea:1.22.6
    container_name: gitea-1
    hostname: gitea-1
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: "autogeneratedsecret"
      GITEA__database__DB_TYPE: "sqlite3"
      GITEA__database__PATH: "/data/gitea/gitea.db"
      GITEA__server__DOMAIN: "gitea-1"
      GITEA__server__SSH_DOMAIN: "gitea-1"
      GITEA__server__ROOT_URL: "http://localhost:30001/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "22"
      GITEA__webhook__ALLOWED_HOST_LIST: "host.docker.internal"
    restart: unless-stopped
    ports:
      - "30001:3000"
      - "2221:22"
    #volumes:
    #  - /tmp/fed-lab/gitea-1:/data
    networks:
      - fednet

  gitea-2:
    image: gitea/gitea:1.22.6
    container_name: gitea-2
    hostname: gitea-2
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: "autogeneratedsecret"
      GITEA__database__DB_TYPE: "sqlite3"
      GITEA__database__PATH: "/data/gitea/gitea.db"
      GITEA__server__DOMAIN: "gitea-2"
      GITEA__server__SSH_DOMAIN: "gitea-2"
      GITEA__server__ROOT_URL: "http://localhost:30002/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "22"
      GITEA__webhook__ALLOWED_HOST_LIST: "host.docker.internal"
    restart: unless-stopped
    ports:
      - "30002:3000"
      - "2222:22"
    #volumes:
    #  - /tmp/fed-lab/gitea-2:/data
    networks:
      - fednet

  gitea-3:
    image: gitea/gitea:1.22.6
    container_name: gitea-3
    hostname: gitea-3
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: "autogeneratedsecret"
      GITEA__database__DB_TYPE: "sqlite3"
      GITEA__database__PATH: "/data/gitea/gitea.db"
      GITEA__server__DOMAIN: "gitea-3"
      GITEA__server__SSH_DOMAIN: "gitea-3"
      GITEA__server__ROOT_URL: "http://localhost:30003/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "22"
      GITEA__webhook__ALLOWED_HOST_LIST: "host.docker.internal"
    restart: unless-stopped
    ports:
      - "30003:3000"
      - "2223:22"
    #volumes:
    #  - /tmp/fed-lab/gitea-3:/data
    networks:
      - fednet

  nats:
    image: nats:2.11-alpine
    container_name: fed-nats
    hostname: nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - fednet

networks:
  fednet:
    driver: bridge
