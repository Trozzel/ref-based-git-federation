[package]
name = "ref-based-fed"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6", features = ["derive"] }
git2 = "0.20.4"
async-nats = "0.45"
axum = { version = "0.8", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
regex = "1.7"
tokio-stream = "0.1"
tracing = "0.1.44"
env_logger = "0.11.10"
csv = "1"

[dev-dependencies]
tempfile = "3.21.0"
